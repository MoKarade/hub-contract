name: CI

# Ce dépôt est la SOURCE DE VÉRITÉ du contrat hub ↔ apps : six consommateurs en
# dépendent (FinanceAI, DriveAI, Hub, app-template, BatchChef, JobAI). Une régression
# ici ne casse pas une app, elle les casse toutes — et elle ne se voit qu'au moment où
# l'un d'eux re-pinne, c'est-à-dire trop tard. Il n'y avait pourtant aucune
# vérification automatisée.
#
# Le job `gate` rejoue EXACTEMENT le gate du CLAUDE.md :
#   npm run build && npm run test && npm run typecheck
on:
  push:
    branches: [main]
    # Les tags aussi : une release est précisément le moment où la vérification compte,
    # puisque c'est ce que les consommateurs vont installer.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    # Plafond : sans lui, un job fige tourne SIX HEURES avant d'echouer (vecu sur
    # DriveAI le 19/08/2026). Calibre sur la duree reelle — 19 s observe.
    timeout-minutes: 15
    name: Gate (build · tests · typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # [CI-PERSIST-CREDS] `actions/checkout` v2+ écrit le GITHUB_TOKEN dans la config git du
          # runner POUR TOUT LE RESTE DU RUN : n'importe quelle étape suivante, y compris une
          # action tierce, peut le lire. Vérifié un par un : aucun workflow de ce dépôt ne fait
          # de `git push` ni d'appel `gh`, donc aucun n'a besoin du jeton persisté.
          persist-credentials: false
          # ⚠️ ET C'EST CE `fetch-depth` QUI REND LE RETRAIT DU JETON SANS CONSÉQUENCE.
          # L'étape « Le tag de la version courante existe-t-il ? » faisait un `git fetch --tags`
          # — donc un appel réseau AUTHENTIFIÉ par le jeton qu'on vient de retirer. Le dépôt est
          # public aujourd'hui (mesuré), donc un fetch anonyme passerait ; le jour où il passerait
          # en privé, l'étape échouerait, et sa cause serait ici, six lignes plus haut, pas là-bas.
          # `fetch-depth: 0` fait apporter l'historique ET les tags par le checkout lui-même, qui
          # s'authentifie AVANT de jeter le jeton. Plus aucun réseau n'est nécessaire ensuite.
          fetch-depth: 0

      # La convention de compte-rendu est une COPIE synchronisée de
      # claude-config/conventions/COMPTE-RENDU.md — un CLAUDE.md ne charge rien hors de son
      # arbre, donc le renvoi seul ne chargerait rien. Une copie sans contrôle redevient une
      # variante locale en silence : c'est le mode de panne que ce pas rend bruyant.
      # Pour la faire évoluer : modifier la SOURCE, propager, mettre à jour cette empreinte.
      - name: La convention de compte-rendu n'a pas dérivé
        run: echo "97e36acba8770c9614b6295773267b9690d07bc5bcd130b3bc0d03da996ab62b  docs/COMPTE-RENDU.md" | sha256sum -c -

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # [CI-IGNORE-SCRIPTS] `--ignore-scripts` empêche les scripts d'installation des
      # DÉPENDANCES de s'exécuter sur le runner — la surface par laquelle un paquet compromis
      # lit les secrets du workflow. Mesuré ici avant d'être posé (18/09/2026, Node 22) :
      # install OK, `dist/` ABSENT juste après (le `prepare` n'a pas tourné), binaire esbuild
      # 0.27.7 fonctionnel — il vient de la dépendance OPTIONNELLE `@esbuild/linux-x64`, que
      # npm installe quels que soient les scripts ; son `postinstall` ne fait que le vérifier.
      # Puis build, 77 tests et typecheck verts.
      #
      # ⚠️ CE QUE CE DRAPEAU COÛTE, ET COMMENT C'EST RACHETÉ. Ce commentaire disait, à juste
      # titre : « `npm ci` déclenche le script `prepare` (donc `build`) : c'est voulu, c'est
      # exactement ce que vit un consommateur qui installe depuis git. » C'était le SEUL
      # contrôle du chemin d'installation d'un consommateur, et `--ignore-scripts` le supprime
      # (npm n'a aucun drapeau pour n'ignorer que les scripts des dépendances). Il n'est pas
      # perdu pour autant, il est découpé en deux : l'étape « Build » ci-dessous prouve que la
      # COMMANDE du `prepare` réussit, et `tests/cheminConsommateur.test.ts` prouve que
      # `package.json` la DÉCLARE toujours en `prepare`. Les deux sont nécessaires : sans la
      # seconde, retirer le `prepare` casserait les six consommateurs sans rien faire rougir.
      - name: Dépendances
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Tests
        run: npm run test

      - name: Typecheck
        run: npm run typecheck

      # Le contrat n'a qu'UNE dépendance runtime (zod) et le CLAUDE.md l'interdit d'en
      # avoir d'autres. La vérifier automatiquement vaut mieux que de la relire : une
      # dépendance ajoutée par distraction se propagerait aux six consommateurs.
      # AVERTISSEMENT, jamais un échec. Le job `version-et-tag` ci-dessous attrape un tag
      # qui DIVERGE de package.json ; il ne peut rien contre un tag ABSENT, qui par
      # définition ne déclenche aucun run — et c'est pourtant l'incident réellement vécu
      # (v1.1.0 annoncé pendant des semaines, jamais tagué, consommateurs bloqués sur le
      # SHA). Un échec serait injuste : entre le commit de bump et le push du tag, il y a
      # toujours une fenêtre légitime. Un avertissement visible dans le résumé du run
      # suffit à ce que personne ne l'oublie « pendant des semaines ».
      - name: Le tag de la version courante existe-t-il ?
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # Pas de `git fetch --tags` ici : les tags sont déjà là (`fetch-depth: 0` au checkout),
          # et le jeton a été retiré de la config git — un fetch dépendrait du fait que le dépôt
          # soit public.
          version="$(node -p 'require("./package.json").version')"
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "Tag v$version présent."
          else
            echo "::warning::package.json annonce $version, mais le tag v$version n'existe pas. Un consommateur qui pinne #v$version échoue à l'installation. Voir la procédure de release du HANDOVER."
          fi

      - name: Aucune dépendance runtime hors zod
        run: |
          node -e '
            const deps = Object.keys(require("./package.json").dependencies ?? {});
            const inattendues = deps.filter((d) => d !== "zod");
            if (inattendues.length > 0) {
              console.error("Dépendances runtime interdites :", inattendues.join(", "));
              console.error("Seul zod est autorisé — voir CLAUDE.md, section « Interdits ».");
              process.exit(1);
            }
            console.log("Dépendances runtime :", deps.join(", ") || "(aucune)");
          '

  version-et-tag:
    # Plafond : sans lui, un job fige tourne SIX HEURES avant d'echouer (vecu sur
    # DriveAI le 19/08/2026). Calibre sur la duree reelle — skippe - job trivial.
    timeout-minutes: 10
    name: Version du package = tag poussé
    # Uniquement sur un tag : ailleurs, il n'y a rien à comparer.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # [CI-PERSIST-CREDS] Idem : ce job ne fait que comparer deux chaînes, il ne pousse
          # rien. Le `GITHUB_TOKEN` n'a aucune raison de rester lisible pour la suite du run.
          persist-credentials: false

      # La règle de release du HANDOVER est « versions synchronisées entre package.json
      # et le tag git ». Elle était tenue à la main, et elle a déjà lâché : le tag
      # v1.1.0 n'a jamais été poussé alors que package.json l'annonçait, si bien qu'un
      # consommateur qui pinnait `#v1.1.0` échouait à l'install. Une convention qui ne
      # se vérifie pas finit toujours par diverger.
      - name: Comparer
        run: |
          version="$(node -p 'require("./package.json").version')"
          tag="${GITHUB_REF_NAME#v}"
          echo "package.json : $version — tag : $tag"
          if [ "$version" != "$tag" ]; then
            echo "::error::package.json ($version) ne correspond pas au tag ($tag)."
            exit 1
          fi
