# Mises à jour proposées automatiquement (porte sécurité de l'Atelier, S6) — ACTIONS SEULEMENT.
# (essai du garde-fou 15/10/2026 : PR qui doit rester bloquée.)
#
# Pas de mises à jour npm de version ici, volontairement : chaque montée de tsup ou de TypeScript
# change la sortie du build, donc dist/ (commité, [DIST-VERSIONNE]) — une PR Dependabot ne peut pas
# le reconstruire et resterait rouge à vie sur « dist/ commité = sortie du build ». Et zod est le
# contrat lui-même : sa majeure est une décision de contrat (tous les consommateurs), pas une
# montée de version. Les alertes de SÉCURITÉ de Dependabot, elles, restent actives.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      # Mineures et correctives : fusionnées seules par Mergify quand la CI est verte (MoKarade/.github#26).
      # Majeures dans leur propre groupe : Marc les fusionne, et elles ne bloquent pas les mineures.
      actions-mineures:
        patterns: ["*"]
        update-types: [minor, patch]
      actions-majeures:
        patterns: ["*"]
        update-types: [major]
