# Fusion automatique par Mergify (plan gratuit), en place depuis le 15/10/2026 : remplace
# l'ancienne fusion automatique de l'Atelier. Une PR prête (pas en brouillon, sans l'étiquette
# « hold ») et dont tous les contrôles obligatoires sont verts est fusionnée en squash.
# Fichiers sensibles (.github/, hooks, qualite/, vercel.json, drizzle/, .env) : jamais
# fusionnés seuls, c'est Marc qui fusionne.
queue_rules:
  - name: default
    merge_method: squash
    batch_size: 1
    queue_conditions:
      - base = main
      - -draft
      - label != hold
      - -files~=^(\.github/|scripts/hooks/|qualite/|vercel\.json|drizzle/|\.env)
      - check-success = Gate (build · tests · typecheck)
      - check-success = Qualité (lint · couverture · code mort · architecture)
      - check-success = Sécurité (secrets · analyse statique)
    merge_conditions:
      - label != hold
      - -files~=^(\.github/|scripts/hooks/|qualite/|vercel\.json|drizzle/|\.env)
      - check-success = Gate (build · tests · typecheck)
      - check-success = Qualité (lint · couverture · code mort · architecture)
      - check-success = Sécurité (secrets · analyse statique)
merge_protections_settings:
  auto_merge_conditions:
    - base = main
    - -draft
    - label != hold
    - -files~=^(\.github/|scripts/hooks/|qualite/|vercel\.json|drizzle/|\.env)
